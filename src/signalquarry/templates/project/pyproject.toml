[project]
name = "{{project}}"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["signalquarry>=0.2,<0.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{package}}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
