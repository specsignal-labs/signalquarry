# Offline checks: no credentials, no network, synthetic data only.
name: lab-ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SIGNALQUARRY_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Conformance and backtest-paper parity for every family
        run: uv run sqy --json check --parity
      - run: uv run pytest -q
      - name: Evidence ledgers and journals intact
        run: uv run sqy --json evidence verify
      - name: Evidence only grew by appending
        if: github.event_name == 'pull_request'
        run: uv run sqy --json evidence verify --base "origin/${{ github.base_ref }}"
      - name: One family per commit
        if: github.event_name == 'pull_request'
        run: uv run python tools/check_commit_scope.py "origin/${{ github.base_ref }}..HEAD"
      - name: No cross-family imports
        run: uv run python tools/check_family_imports.py
      - name: Publication policies are valid (default-deny)
        run: |
          for policy in families/*/publication.yaml; do
            family=$(basename "$(dirname "$policy")")
            uv run sqy --json evidence export --family "$family" --out "/tmp/export-$family" > /dev/null
          done
      - name: Nothing in the lab mentions forbidden names (lab.forbidden_references)
        run: uv run python tools/check_references.py
