name: Bug report
description: Something behaves differently from the docs.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened and what you expected}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Commands to reproduce (demo projects preferred), render: shell}
    validations: {required: true}
  - type: textarea
    id: envelope
    attributes:
      label: The JSON envelope of the failing command (remove anything private)
      render: json
  - type: textarea
    id: doctor
    attributes: {label: Output of `sqy doctor --json`, render: json}
    validations: {required: true}
