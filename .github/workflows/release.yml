name: release

# Tag vX.Y.Z (signed) on main → build once → smoke-test the wheel → publish to PyPI with
# Trusted Publishing (no tokens) from the reviewer-gated "pypi" environment → GitHub
# release with schemas, the stdlib verifier, an SBOM and checksums.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Version matches the tag
        run: |
          version=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Build
        run: uv build --out-dir dist
      - name: Smoke-test the wheel in a fresh environment
        run: |
          uv venv --python 3.12 /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/sqy --json init flow --demo > /dev/null && cd flow
          /tmp/smoke/bin/sqy --json check > /dev/null
          /tmp/smoke/bin/sqy --json backtest --strategy sma-trend > /dev/null
          /tmp/smoke/bin/python "$GITHUB_WORKSPACE/evals/replay.py" --sqy /tmp/smoke/bin/sqy > /dev/null
      - name: SBOM and release assets
        run: |
          uvx --from cyclonedx-bom cyclonedx-py environment /tmp/smoke/bin/python --output-file dist/signalquarry.cdx.json
          mkdir -p assets
          cp -r src/signalquarry/schemas assets/schemas
          cp src/signalquarry/_internal/canonical.py src/signalquarry/_internal/evidence/verify.py assets/
          (cd assets && tar czf ../dist/signalquarry-verifier.tar.gz .)
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi # required reviewers configured by the maintainer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Keep only the distributions
        run: find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete && rm -f dist/signalquarry-verifier.tar.gz
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  github-release:
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
