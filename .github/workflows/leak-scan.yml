name: leak-scan

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Scan with private project rules
        env:
          LEAK_SCAN_RULES_JSON: ${{ secrets.LEAK_SCAN_RULES_JSON }}
        run: python tools/leak_scan.py --require-rules .
