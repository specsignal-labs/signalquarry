name: leak-scan

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Scan with private project rules
        env:
          LEAK_SCAN_RULES_JSON: ${{ secrets.LEAK_SCAN_RULES_JSON }}
        run: python tools/leak_scan.py --require-rules .
