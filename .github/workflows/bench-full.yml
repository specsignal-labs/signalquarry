name: bench-full

# The full scale benchmark (10y x 500 symbols, plus the 3,000-symbol spooled engine diagnostic and
# research panel). Too slow for every pull request, so it runs weekly, on demand, and on pull requests
# that change the benchmark itself. Not a required check: the 3,000-symbol targets were set on a
# laptop and shared runners are slower and noisier, so read a red run as "look at the trend".

on:
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch: {}
  pull_request:
    paths:
      - tools/bench.py
      - .github/workflows/bench-full.yml

permissions:
  contents: read

concurrency:
  group: bench-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --python 3.12

      - name: Full benchmark (warn at 1.5x, fail at 2x; 3,000-symbol cases fail at 180s or 2 GB)
        shell: bash
        run: |
          # GitHub runs bash with -e: capture the status so a failing benchmark still writes its summary.
          status=0
          uv run python tools/bench.py --full | tee bench-full.txt || status=$?
          {
            echo "## bench --full"
            echo
            echo '```'
            cat bench-full.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
